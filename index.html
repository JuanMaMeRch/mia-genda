    <script>
      /* Colores de día o de noche desde el primer momento (lo último elegido en este aparato), sin destellos. */
      (function () {
        try {
          var g = function (k, d) {
            var v = localStorage.getItem('miagenda:' + k);
            return v === null ? d : JSON.parse(v);
          };
          var p = g('tema', 'claro');
          var h = new Date().getHours();
          var night = p === 'oscuro' || (p === 'hora' && (h < 7 || h >= 19)) || (p === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
          var look = night ? (g('tema-noche', 'negro') === 'azul' ? 'azul' : 'negro') : g('tema-dia', 'blanco') === 'gris' ? 'gris' : 'blanco';
          var r = document.documentElement;
          r.dataset.theme = night ? 'oscuro' : 'claro';
          r.dataset.look = look;
          var bar = { blanco: '#f3f4f6', gris: '#e3e5e9', negro: '#000000', azul: '#07182b' }[look];
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bar);
        } catch (e) {}
      })();
